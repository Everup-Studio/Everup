<!DOCTYPE html>
<html lang="ru" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>База Знаний — Everup</title>

<link rel="icon" href="static/favicon.svg?v=1" type="image/svg+xml">

<script>
  (function() {
    let theme = 'light';
    try {
      theme = localStorage.getItem('everup-theme') || window.name || 'light';
    } catch (e) {
      theme = window.name || 'light';
    }
    if (theme !== 'light' && theme !== 'dark') theme = 'light';
    document.documentElement.setAttribute('data-theme', theme);
  })();
</script>

<style>
:root {
  --brand-dark: #2C0B4E; --brand-main: #7B2F9D; --brand-light: #b15ce0;
  --bg: #fafaf7; --surface: #ffffff; --surface-hover: #f5f5f0;
  --text: #1a1a1a; --text-muted: #6b6b6b; --border: #e5e5e0; --border-strong: #d0d0c8;
  --accent: var(--brand-main); --accent-hover: var(--brand-dark); --accent-light: #f2e8f7; --accent-text: #ffffff;
  --danger: #c0392b; --shadow: 0 1px 3px rgba(0,0,0,0.06); --radius: 10px; --font: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
}
[data-theme="dark"] {
  --bg: #14161a; --surface: #1c1f24; --surface-hover: #23272e; --text: #e8e8e8; --text-muted: #909090;
  --border: #2a2f36; --border-strong: #3a4048; --accent: var(--brand-light); --accent-hover: #c97bef; --accent-light: #2a1738; --accent-text: #0e1410;
  --danger: #e57373; --shadow: 0 1px 3px rgba(0,0,0,0.3);
}
* { box-sizing: border-box; }
html, body { margin: 0; padding: 0; overflow-x: hidden; }
body { font-family: var(--font); background: var(--bg); color: var(--text); line-height: 1.6; font-size: 15px; display: flex; flex-direction: column; min-height: 100vh; }
a { color: var(--accent); text-decoration: none; }
a:hover { text-decoration: underline; }

/* Шапка (ПК версия) */
#header { 
  position: sticky; top: 0; z-index: 100; 
  background: var(--surface); border-bottom: 1px solid var(--border); 
  padding: 12px 20px; display: flex; align-items: center; gap: 20px; 
  box-shadow: var(--shadow); 
  flex-wrap: nowrap; 
}
.header-spacer { flex: 1; }

.logo { 
  font-weight: 800; font-size: 20px; cursor: pointer; 
  background: linear-gradient(135deg, var(--brand-dark), var(--brand-main)); 
  -webkit-background-clip: text; -webkit-text-fill-color: transparent; 
  flex-shrink: 0;
}
[data-theme="dark"] .logo { 
  background: linear-gradient(135deg, var(--brand-main), var(--brand-light)); 
  -webkit-background-clip: text; -webkit-text-fill-color: transparent; 
}

.nav-links { display: flex; gap: 16px; flex-shrink: 0; }
.nav-links a { color: var(--text-muted); font-weight: 500; font-size: 15px; }
.nav-links a:hover, .nav-links a.active { color: var(--accent); text-decoration: none; }

.header-btn { 
  padding: 8px 14px; background: var(--accent-light); color: var(--accent); 
  border: 1px solid var(--border); border-radius: 8px; cursor: pointer; 
  font-family: inherit; font-size: 14px; font-weight: 500; 
  display: inline-flex; align-items: center; justify-content: center; gap: 6px; transition: all 0.15s; 
  flex-shrink: 0;
}
.header-btn:hover { background: var(--accent); color: var(--accent-text); border-color: var(--accent); }

/* Базовые стили для поиска */
.search-box { width: 250px; flex-shrink: 0; }
.search-box input {
  width: 100%; padding: 8px 14px; border: 1px solid var(--border); border-radius: 20px;
  background: var(--bg); color: var(--text); font-family: inherit; font-size: 14px;
}

/* ЖЕСТКИЕ ПРАВИЛА ДЛЯ КОНТЕЙНЕРА ПОИСКА И КОРЗИНЫ */
.db-sticky-row {
  display: flex !important;
  flex-direction: row !important;
  flex-wrap: nowrap !important;
  align-items: center !important;
  gap: 10px;
}

footer { text-align: center; padding: 24px 20px; color: var(--text-muted); font-size: 13px; border-top: 1px solid var(--border); background: var(--surface); margin-top: auto; }

/* КНОПКА СКРОЛЛА */
.scroll-btn {
  position: fixed; bottom: 20px; right: 20px; width: 40px; height: 40px; border-radius: 50%;
  background-color: var(--bg); color: var(--text); border: 1px solid var(--border-strong);
  box-shadow: 0 3px 8px rgba(0,0,0,0.15); display: none; align-items: center; justify-content: center;
  cursor: pointer; z-index: 999; transition: background-color 0.2s, color 0.2s; padding: 0;
}
.scroll-btn.visible { display: flex; }
.scroll-btn svg { width: 18px; height: 18px; display: block; }
.scroll-btn:hover { background-color: var(--brand-main); color: #ffffff; border-color: var(--brand-main); }

/* МОБИЛЬНАЯ АДАПТАЦИЯ */
@media (max-width: 768px) {
  #header { 
    position: static; 
    display: flex; 
    flex-wrap: wrap; 
    padding: 12px 15px; 
    gap: 15px;
    background: var(--surface);
    border-bottom: none;
  }
  
  .logo { order: 1; }
  #theme-btn { order: 2; margin-left: auto; }
  .nav-links { 
    order: 3; 
    width: 100%; 
    justify-content: space-between; 
    margin-bottom: 5px;
  }
  .header-spacer { display: none; }
  
  /* Липкий блок поиска и корзины */
  .db-sticky-row {
    order: 4;
    position: sticky;
    top: 0;
    z-index: 100;
    width: calc(100% + 30px);
    margin: 0 -15px -12px -15px;
    padding: 10px 15px;
    background: var(--surface);
    border-bottom: 1px solid var(--border);
    box-shadow: 0 4px 6px -2px rgba(0,0,0,0.1);
    gap: 15px;
  }
  
  .db-sticky-row .search-box { flex: 1; width: 100%; margin: 0; }
  .db-sticky-row #cart-btn { flex-shrink: 0; margin: 0; }
}


<style>
.cart-badge { background: var(--accent); color: var(--accent-text); border-radius: 10px; padding: 1px 7px; font-size: 12px; font-weight: 600; min-width: 24px; text-align: center; }
#app { max-width: 1200px; margin: 0 auto; padding: 24px 20px 80px; width: 100%; flex: 1; }
.home-title { font-size: 28px; margin: 16px 0 8px; }
.home-subtitle { color: var(--text-muted); margin-bottom: 24px; max-width: 720px; }
.cat-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 16px; }
.cat-card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 20px; cursor: pointer; box-shadow: var(--shadow); transition: all 0.15s; }
.cat-card:hover { border-color: var(--accent); transform: translateY(-2px); }
.cat-card.disabled { opacity: 0.55; cursor: default; }

.cat-icon { font-size: 32px; margin-bottom: 8px; line-height: 1; }

.breadcrumbs a:hover, .breadcrumbs span.link:hover { text-decoration: underline; }
.category-layout { display: grid; grid-template-columns: 260px 1fr; gap: 24px; align-items: start; }
.filters { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 16px; position: sticky; top: 80px; max-height: calc(100vh - 100px); overflow-y: auto; }

.filter-item.active { background: var(--accent-light); color: var(--accent); font-weight: 500; }

.tag-section > summary { list-style: none; cursor: pointer; outline: none; display: flex; justify-content: space-between; align-items: center; }

.tag-section[open] > summary::after { transform: rotate(180deg); }
.tag-search-input { width: 100%; padding: 6px 10px; font-size: 13px; border: 1px solid var(--border); border-radius: 6px; background: var(--bg); color: var(--text); margin-top: 8px; box-sizing: border-box; }
.tag-list-scroll { max-height: 220px; overflow-y: auto; margin-top: 6px; padding-right: 4px; }

.entries-list { display: flex; flex-direction: column; gap: 10px; }
.entry-card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 16px; display: flex; gap: 12px; cursor: pointer; transition: all 0.15s; }
.entry-card:hover { border-color: var(--accent); box-shadow: var(--shadow); }
.checkbox { width: 20px; height: 20px; border: 2px solid var(--border-strong); border-radius: 4px; cursor: pointer; flex-shrink: 0; margin-top: 2px; display: flex; align-items: center; justify-content: center; background: var(--surface); }
.checkbox.checked { background: var(--accent); border-color: var(--accent); }
.checkbox.checked::after { content: '✓'; color: var(--accent-text); font-size: 13px; font-weight: 700; }
.entry-content { flex: 1; min-width: 0; }
.entry-title { font-weight: 600; font-size: 15px; margin-bottom: 2px; }
.entry-meta { font-size: 12px; color: var(--text-muted); margin-bottom: 4px; }
.entry-summary { font-size: 13px; color: var(--text); opacity: 0.85; }
.detail { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 32px; max-width: 900px; margin: 0 auto; box-shadow: var(--shadow); }
.detail-title { font-size: 28px; font-weight: 700; margin: 0 0 8px; }
.detail-meta { font-size: 13px; color: var(--text-muted); margin-bottom: 20px; }
.action-row { display: flex; gap: 10px; margin-bottom: 24px; flex-wrap: wrap; }
.btn { padding: 9px 16px; border: 1px solid var(--border); background: var(--surface); color: var(--text); border-radius: 8px; cursor: pointer; font-size: 14px; font-weight: 500; display: inline-flex; align-items: center; justify-content: center; gap: 6px; }
.btn:hover { background: var(--surface-hover); }
.btn-primary { background: var(--accent); color: var(--accent-text); border-color: var(--accent); }
.btn-primary:hover { background: #9338bb; border-color: #9338bb; color: var(--accent-text); }
.btn-copied { background: var(--accent-light); color: var(--accent); border-color: var(--accent); }
.content { line-height: 1.7; font-size: 15px; overflow-wrap: break-word; }
.content h1, .content h2, .content h3 { margin: 24px 0 12px; line-height: 1.3; }
.content p { margin: 0 0 12px; }
.content ul, .content ol { margin: 0 0 12px; padding-left: 24px; }
.content hr { border: 0; border-top: 1px solid var(--border); margin: 24px 0; }
.content table { width: 100%; border-collapse: collapse; margin: 0 0 16px; font-size: 14px; display: block; overflow-x: auto; }
.content th, .content td { border: 1px solid var(--border); padding: 8px 12px; text-align: left; }
.content th { background: var(--surface-hover); font-weight: 600; }
.variations-section { margin-top: 32px; padding-top: 24px; border-top: 2px solid var(--border); }
.variation-item { display: flex; align-items: center; gap: 12px; padding: 10px 14px; border: 1px solid var(--border); border-radius: 8px; background: var(--bg); margin-bottom: 6px; flex-wrap: wrap; }
.variation-item .var-open { margin-left: auto; color: var(--accent); cursor: pointer; font-size: 13px; text-decoration: none; padding: 4px 10px; border-radius: 4px; white-space: nowrap; }
.variation-item .var-open:hover { background: var(--accent-light); }

.cart-page { max-width: 900px; margin: 0 auto; }
.cart-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 24px; gap: 12px; flex-wrap: wrap; }
.cart-title { font-size: 24px; font-weight: 700; margin: 0; }
.cart-item { display: flex; align-items: center; gap: 12px; padding: 12px 16px; background: var(--surface); border: 1px solid var(--border); border-radius: 8px; margin-bottom: 6px; flex-wrap: wrap; }
.cart-empty { text-align: center; padding: 60px 20px; color: var(--text-muted); }
.empty-state { text-align: center; padding: 60px 20px; color: var(--text-muted); }
.toast { position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%) translateY(100px); background: var(--text); color: var(--bg); padding: 12px 22px; border-radius: 8px; z-index: 1000; transition: transform 0.25s; white-space: nowrap; }
.toast.show { transform: translateX(-50%) translateY(0); }

.ci-open {

  border-radius: 4px;

}
.ci-open:hover { background: var(--accent-light); }

.core-cart-block {
  margin-bottom: 16px;

  border-bottom: 1px solid var(--border);
}

.parent-link {
  color: var(--accent);

  font-weight: 500;

.parent-link:hover {

#btn-collapse {

}

#btn-filter-collapse {

}

/* МОБИЛЬНАЯ АДАПТАЦИЯ */
@media (max-width: 768px) {

  <svg id="scroll-icon-down" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" style="display: none;"><path d="M12 5v14M19 12l-7 7-7-7"/></svg>

<script>
  const themeBtn = document.getElementById('theme-btn');
  let currentTheme = document.documentElement.getAttribute('data-theme') || 'light';
  themeBtn.textContent = currentTheme === 'dark' ? '☀️' : '🌙';

  themeBtn.addEventListener('click', () => {
    currentTheme = document.documentElement.getAttribute('data-theme');
    const next = currentTheme === 'dark' ? 'light' : 'dark';
    document.documentElement.setAttribute('data-theme', next);
    window.name = next; 
    try { localStorage.setItem('everup-theme', next); } catch (e) {}
    themeBtn.textContent = next === 'dark' ? '☀️' : '🌙';
  });

  const scrollBtn = document.getElementById('scroll-btn');
  const iconUp = document.getElementById('scroll-icon-up');
  const iconDown = document.getElementById('scroll-icon-down');
  let scrollState = 'up';
  let savedScrollPos = 0;
  let isAutoScrolling = false;

  window.addEventListener('scroll', () => {
    if (isAutoScrolling) return; 
    const currentScroll = window.scrollY;
    if (scrollState === 'up') {
      if (currentScroll > window.innerHeight) scrollBtn.classList.add('visible');
      else if (currentScroll < 50) scrollBtn.classList.remove('visible');
    } else if (scrollState === 'down') {
      if (currentScroll > 50) {
        scrollState = 'up'; iconUp.style.display = 'block'; iconDown.style.display = 'none'; scrollBtn.classList.add('visible');
      }
    }
  });

  scrollBtn.addEventListener('click', () => {
    isAutoScrolling = true;
    if (scrollState === 'up') {
      savedScrollPos = window.scrollY;
      window.scrollTo({ top: 0, behavior: 'smooth' });
      scrollState = 'down'; iconUp.style.display = 'none'; iconDown.style.display = 'block'; scrollBtn.title = 'Вернуться обратно';
    } else {
      window.scrollTo({ top: savedScrollPos, behavior: 'smooth' });
      scrollState = 'up'; iconUp.style.display = 'block'; iconDown.style.display = 'none'; scrollBtn.title = 'Наверх';
    }
    setTimeout(() => { isAutoScrolling = false; }, 800); 
  });
</script>

let isTextExpanded = false;
let isFilterExpanded = false; 
let isTagsExpanded = false;

function saveCart() { localStorage.setItem(LS_CART, JSON.stringify(Array.from(cart))); localStorage.setItem(LS_CART_SELECTED, JSON.stringify(Array.from(cartSelected))); }
function toggleCart(id) { if (cart.has(id)) { cart.delete(id); cartSelected.delete(id); } else { cart.add(id); cartSelected.add(id); } saveCart(); updateCartBadge(); }
function isInCart(id) { return cart.has(id); }
function updateCartBadge() { const b = document.getElementById('cart-badge'); if (cart.size === 0) { b.style.visibility = 'hidden'; } else { b.style.visibility = 'visible'; b.textContent = cart.size; } }
function pluralize(n, forms) { const m = n % 100; if (m >= 11 && m <= 19) return forms[2]; const m10 = n % 10; if (m10 === 1) return forms[0]; if (m10 >= 2 && m10 <= 4) return forms[1]; return forms[2]; }
function getCategoryById(id) { return CATEGORIES.find(c => c.id === id); }
function getCategoryTitle(id) { const c = getCategoryById(id); return c ? c.title : id; }
function getEntryById(id) { return DB.find(e => e.id === id); }
function getDifficulty(entry) { if (!entry.subcategories) return null; const d = entry.subcategories.find(s => /^Сложность \d+$/.test(s)); return d ? parseInt(d.split(' ')[1]) : null; }
function escapeHtml(s) { return s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;'); }
function showToast(msg) { const t = document.getElementById('toast') || (() => { const el = document.createElement('div'); el.id = 'toast'; el.className = 'toast'; document.body.appendChild(el); return el; })(); t.textContent = msg; t.classList.add('show'); clearTimeout(t._timer); t._timer = setTimeout(() => t.classList.remove('show'), 2000); }
async function copyText(text) { try { await navigator.clipboard.writeText(text); return true; } catch (e) { const ta = document.createElement('textarea'); ta.value = text; document.body.appendChild(ta); ta.select(); const ok = document.execCommand('copy'); document.body.removeChild(ta); return ok; } }

function inlineFormat(s) { s = escapeHtml(s); s = s.replace(/\*\*([^*\n]+)\*\*/g, '<strong>$1</strong>'); s = s.replace(/(^|[^*])\*([^*\n]+)\*(?!\*)/g, '$1<em>$2</em>'); return s; }
function renderTable(tableLines) { if (tableLines.length < 2) return '<p>' + tableLines.map(inlineFormat).join('<br>') + '</p>'; const parseRow = (line) => line.trim().replace(/^\|/, '').replace(/\|$/, '').split('|').map(c => c.trim()); const header = parseRow(tableLines[0]); const isSep = /^\|[-\s:|]+\|$/.test(tableLines[1].trim()); let html = '<table><thead><tr>'; header.forEach(c => html += '<th>' + inlineFormat(c) + '</th>'); html += '</tr></thead><tbody>'; for (let j = isSep ? 2 : 1; j < tableLines.length; j++) { const cells = parseRow(tableLines[j]); html += '<tr>'; cells.forEach(c => html += '<td>' + inlineFormat(c) + '</td>'); html += '</tr>'; } return html + '</tbody></table>'; }
function mdToHtml(md) {
  if (!md) return '';
  const lines = md.split('\n'); const out = []; let i = 0;
  while (i < lines.length) {
    const line = lines[i];
    if (line.trim() === '') { i++; continue; }
    if (/^---+$/.test(line.trim())) { out.push('<hr>'); i++; continue; }
    const hMatch = line.match(/^(#{1,6})\s+(.+)$/);
    if (hMatch) { const lvl = hMatch[1].length; out.push('<h' + lvl + '>' + inlineFormat(hMatch[2]) + '</h' + lvl + '>'); i++; continue; }
    if (line.trim().startsWith('|')) { const tbl = []; while (i < lines.length && lines[i].trim().startsWith('|')) { tbl.push(lines[i]); i++; } out.push(renderTable(tbl)); continue; }
    if (/^\s*[-*]\s+/.test(line)) { const items = []; while (i < lines.length && /^\s*[-*]\s+/.test(lines[i])) { items.push(lines[i].replace(/^\s*[-*]\s+/, '')); i++; } out.push('<ul>' + items.map(it => '<li>' + inlineFormat(it) + '</li>').join('') + '</ul>'); continue; }
    if (/^\s*\d+\.\s+/.test(line)) { const items = []; while (i < lines.length && /^\s*\d+\.\s+/.test(lines[i])) { items.push(lines[i].replace(/^\s*\d+\.\s+/, '')); i++; } out.push('<ol>' + items.map(it => '<li>' + inlineFormat(it) + '</li>').join('') + '</ol>'); continue; }
    const paraLines = [line]; i++;
    while (i < lines.length && lines[i].trim() !== '' && !/^#{1,6}\s/.test(lines[i]) && !/^\s*[-*]\s+/.test(lines[i]) && !/^\s*\d+\.\s+/.test(lines[i]) && !/^---+$/.test(lines[i].trim()) && !lines[i].trim().startsWith('|')) { paraLines.push(lines[i]); i++; }
    out.push('<p>' + paraLines.map(inlineFormat).join('<br>') + '</p>');
  }
  return out.join('\n');
}

function parseHash() { let hash = location.hash.replace(/^#/, ''); if (!hash || hash === '/') return { page: 'home' }; if (hash === '/cart') return { page: 'cart' }; if (hash.startsWith('/category/')) return { page: 'category', id: hash.slice(10) }; if (hash.startsWith('/entry/')) return { page: 'detail', id: hash.slice(7) }; if (hash.startsWith('/search')) { const parts = hash.split('?'); return { page: 'search', q: parts.length > 1 ? (new URLSearchParams(parts[1]).get('q') || '') : '' }; } return { page: 'home' }; }

function updateSearchPlaceholder() {
  const input = document.getElementById('search-input');
  if (input) {
    input.placeholder = window.innerWidth <= 768 ? 'Поиск...' : 'Поиск по базе';
  }
}
window.addEventListener('resize', updateSearchPlaceholder);

function render() {
  updateSearchPlaceholder();
  
  const route = parseHash(); const app = document.getElementById('app');
  const collapseBtn = document.getElementById('btn-collapse');
  const filterCollapseBtn = document.getElementById('btn-filter-collapse');
  
  if (route.page !== 'detail') collapseBtn.classList.remove('visible');
  if (route.page !== 'category') { filterCollapseBtn.classList.remove('visible'); isFilterExpanded = false; }

  if (route.page === 'home') renderHome(app);
  else if (route.page === 'category') renderCategory(app, route.id);
  else if (route.page === 'detail') renderDetail(app, route.id);
  else if (route.page === 'cart') renderCart(app);
  else if (route.page === 'search') renderSearch(app, route.q);
  updateCartBadge(); 
  if (route.page !== 'detail') window.scrollTo(0, 0);
}

function renderHome(app) {
  const counts = {}; DB.forEach(e => { if (!e.parentId) counts[e.category] = (counts[e.category] || 0) + 1; });
  let html = '<h1 class="home-title">База знаний Everup</h1><p class="home-subtitle">Расширенный лор и дополнительные детали по запросу. Выберите категорию, отметьте нужные записи и скачайте набор.</p><div class="cat-grid">';
  CATEGORIES.forEach(cat => {
    const count = counts[cat.id] || 0; const isEmpty = count === 0;
    const meta = isEmpty ? 'скоро' : (count + ' ' + pluralize(count, ['запись', 'записи', 'записей']));
    html += '<div class="cat-card' + (isEmpty ? ' disabled' : '') + '" data-cat="' + cat.id + '"><div class="cat-icon">' + cat.icon + '</div><div class="cat-title">' + cat.title + '</div><div class="cat-meta">' + meta + '</div></div>';
  });
  html += '</div>'; app.innerHTML = html;
  
  app.querySelectorAll('.cat-card:not(.disabled)').forEach(card => card.addEventListener('click', () => {
    const catId = card.dataset.cat;
    if (catId === 'core') { const coreEntry = DB.find(e => e.category === 'core'); if (coreEntry) { location.hash = '/entry/' + coreEntry.id; return; } }
    location.hash = '/category/' + catId;
  }));
}

function renderCategory(app, catId) {
  if (catId === 'core') { const coreEntry = DB.find(e => e.category === 'core'); if (coreEntry) { location.hash = '/entry/' + coreEntry.id; return; } }
  const cat = getCategoryById(catId); if (!cat) return;
  
  const catEntries = DB.filter(e => e.category === catId && !e.parentId);
  
  const allSubcats = new Set(); const allTags = new Set();
  catEntries.forEach(e => { 
    if(e.subcategories) e.subcategories.forEach(s => allSubcats.add(s)); 
    if(e.tags) e.tags.forEach(t => allTags.add(t)); 
  });
  
  const filtered = catEntries.filter(e => { if (filters.subcats.length > 0 && (!e.subcategories || !filters.subcats.some(s => e.subcategories.includes(s)))) return false; if (filters.tags.length > 0 && (!e.tags || !filters.tags.every(t => e.tags.includes(t)))) return false; return true; });
  
  const isMobile = window.innerWidth <= 768;

  let html = '<div class="breadcrumbs"><a href="#/">База знаний</a><span class="sep"> / </span><span>' + cat.title + '</span></div>';
  
  if (isMobile && !isFilterExpanded && (allSubcats.size > 0 || allTags.size > 0)) {
    html += `<button class="btn" id="btn-toggle-filters" style="width: 100%; margin-bottom: 16px; justify-content: center;">Показать фильтры</button>`;
  }

  html += '<div class="category-layout">';
  
  if (!isMobile || isFilterExpanded) {
    html += '<aside class="filters">';
    if (allSubcats.size > 0) { 
      html += '<div class="filter-section"><div class="filter-title">Подкатегории</div>'; 
      Array.from(allSubcats).sort().forEach(s => { 
        const active = filters.subcats.includes(s); 
        const cnt = catEntries.filter(e => e.subcategories && e.subcategories.includes(s)).length; 
        html += '<div class="filter-item' + (active ? ' active' : '') + '" data-subcat="' + s + '">' + s + '<span class="count">' + cnt + '</span></div>'; 
      }); 
      html += '</div>'; 
    }
    
    if (allTags.size > 0) {
      const tagCounts = {};
      catEntries.forEach(e => { if (e.tags) e.tags.forEach(t => { tagCounts[t] = (tagCounts[t] || 0) + 1; }); });
      const sortedTags = Array.from(allTags).sort((a, b) => (tagCounts[b] || 0) - (tagCounts[a] || 0) || a.localeCompare(b));
      
      const selCount = filters.tags.length;
      const badge = selCount > 0 ? ` <span style="color:var(--accent); font-weight:600;">(${selCount} выбрано)</span>` : '';

      html += `<div class="filter-section">
        <details class="tag-section"${isTagsExpanded ? ' open' : ''}>
          <summary class="filter-title">Теги (${allTags.size})${badge}</summary>
          <input type="text" class="tag-search-input" id="tag-search-input" placeholder="Поиск тега...">
          <div class="tag-list-scroll" id="tag-list-scroll">
      `;
      
      filters.tags.forEach(t => {
        if (allTags.has(t)) html += '<div class="filter-item active" data-tag="' + t + '">#' + t + '</div>';
      });
      
      sortedTags.forEach(t => {
        if (!filters.tags.includes(t)) {
          html += '<div class="filter-item" data-tag="' + t + '">#' + t + '<span class="count">' + (tagCounts[t] || 0) + '</span></div>';
        }
      });
      
      html += `</div></details></div>`;
    }
    
    if (filters.subcats.length > 0 || filters.tags.length > 0) html += '<button class="filter-reset" id="filter-reset">Сбросить фильтры</button>';
    html += '</aside>';
  }
  
  html += '<div>';
  if (filtered.length === 0) { html += '<div class="empty-state">Ничего не найдено.</div>'; } 
  else {
    html += '<div class="entries-list">';
    const pinnedEntries = filtered.filter(e => e.pinned);
    const normalEntries = filtered.filter(e => !e.pinned);
    const renderCard = (e) => {
      const checked = isInCart(e.id); const diff = getDifficulty(e);
      let metaLine = cat.title; if (e.parentId) { const p = getEntryById(e.parentId); if (p) metaLine += ' · вариация «' + p.title + '»'; }
      if (diff) metaLine += ' · сложность ' + diff;
      return '<div class="entry-card" data-id="' + e.id + '"><div class="checkbox' + (checked ? ' checked' : '') + '" data-check-id="' + e.id + '"></div><div class="entry-content"><div class="entry-title">' + e.title + '</div><div class="entry-meta">' + metaLine + '</div><div class="entry-summary">' + e.summary + '</div></div></div>';
    };
    pinnedEntries.forEach(e => { html += renderCard(e); });
    if (pinnedEntries.length > 0 && normalEntries.length > 0) html += '<hr style="border: 0; border-top: 2px solid var(--border); margin: 10px 0;">';
    normalEntries.forEach(e => { html += renderCard(e); });
    html += '</div>';
  }
  html += '</div></div>'; app.innerHTML = html;
  
  const toggleBtn = document.getElementById('btn-toggle-filters');
  if (toggleBtn) {
    toggleBtn.addEventListener('click', () => { isFilterExpanded = true; renderCategory(app, catId); });
  }

  const filterCollapseBtn = document.getElementById('btn-filter-collapse');
  if (isMobile && isFilterExpanded) { filterCollapseBtn.classList.add('visible'); } 
  else { filterCollapseBtn.classList.remove('visible'); }
  
  filterCollapseBtn.onclick = () => { isFilterExpanded = false; renderCategory(app, catId); window.scrollTo({ top: 0, behavior: 'smooth' }); };

  const tagDetails = document.querySelector('.tag-section');
  if (tagDetails) {
    tagDetails.addEventListener('toggle', () => { isTagsExpanded = tagDetails.open; });
  }
  
  const tagSearchInput = document.getElementById('tag-search-input');
  if (tagSearchInput) {
    tagSearchInput.addEventListener('input', (e) => {
      const query = e.target.value.toLowerCase().trim();
      document.querySelectorAll('#tag-list-scroll .filter-item').forEach(el => {
        const tag = (el.dataset.tag || '').toLowerCase();
        el.style.display = tag.includes(query) ? '' : 'none';
      });
    });
  }

  app.querySelectorAll('.filter-item[data-subcat]').forEach(el => el.addEventListener('click', () => { const s = el.dataset.subcat; const idx = filters.subcats.indexOf(s); if (idx >= 0) filters.subcats.splice(idx, 1); else filters.subcats.push(s); renderCategory(app, catId); }));
  app.querySelectorAll('.filter-item[data-tag]').forEach(el => el.addEventListener('click', () => { const t = el.dataset.tag; const idx = filters.tags.indexOf(t); if (idx >= 0) filters.tags.splice(idx, 1); else filters.tags.push(t); renderCategory(app, catId); }));
  const rBtn = document.getElementById('filter-reset'); if (rBtn) rBtn.addEventListener('click', () => { filters = { subcats: [], tags: [] }; renderCategory(app, catId); });
  app.querySelectorAll('.entry-card').forEach(card => card.addEventListener('click', (ev) => { if (ev.target.closest('.checkbox')) return; location.hash = '/entry/' + card.dataset.id; }));
  app.querySelectorAll('.checkbox[data-check-id]').forEach(cb => cb.addEventListener('click', (ev) => { ev.stopPropagation(); toggleCart(cb.dataset.checkId); cb.classList.toggle('checked'); }));
}

function renderDetail(app, id) {
  const e = getEntryById(id); if (!e) return;
  if (currentDetailId !== id) { isTextExpanded = false; currentDetailId = id; }

  const cat = getCategoryTitle(e.category); 
  const parent = e.parentId ? getEntryById(e.parentId) : null;
  
  const explicitChildren = (e.children || []).map(cid => getEntryById(cid)).filter(Boolean);
  const implicitChildren = DB.filter(entry => entry.parentId === e.id);
  const childrenMap = new Map();
  explicitChildren.forEach(c => childrenMap.set(c.id, c));
  implicitChildren.forEach(c => childrenMap.set(c.id, c));
  const children = Array.from(childrenMap.values());

  const dependencies = (e.dependencies || []).map(did => getEntryById(did)).filter(Boolean);
  const checked = isInCart(e.id);
  
  let html = '<div class="breadcrumbs"><a href="#/">База знаний</a> <span class="sep">/</span> ';
  if (e.category !== 'core') html += '<a href="#/category/' + e.category + '">' + cat + '</a> <span class="sep">/</span> ';
  html += '<span>' + e.title + '</span></div>';
  
  html += '<div class="detail">';
  html += '<div class="detail-header" style="display: flex; justify-content: space-between; align-items: flex-start; gap: 16px; margin-bottom: 8px; flex-wrap: wrap;">';
  html += '<h1 class="detail-title" style="margin:0;">' + e.title + '</h1>';
  if (parent) html += '<a href="#/entry/' + parent.id + '" class="parent-link">← К родительской записи</a>';
  html += '</div>';
  
  html += '<div class="action-row" style="margin-top: 20px;"><button class="btn btn-primary" id="btn-copy">📋 Копировать</button><button class="btn' + (checked ? ' btn-copied' : '') + '" id="btn-cart">' + (checked ? '✓ В корзине' : '＋ В корзину') + '</button></div>';
  
  const lines = e.content.split('\n');
  const isLong = lines.length > 30;
  let displayContent = e.content;
  if (isLong && !isTextExpanded) displayContent = lines.slice(0, 30).join('\n');
  
  html += '<div class="content" id="entry-content">' + mdToHtml(displayContent) + '</div>';
  
  if (isLong && !isTextExpanded) html += '<button class="btn" id="btn-expand" style="margin-top: 16px; width: 100%;">Показать полностью (' + lines.length + ' строк)</button>';
  
  if (dependencies.length > 0) {
    html += '<div class="variations-section"><div class="variations-title">Зависимости (' + dependencies.length + ')</div><div class="variations-list">';
    dependencies.forEach(dep => { const chChecked = isInCart(dep.id); html += '<div class="variation-item"><div class="checkbox' + (chChecked ? ' checked' : '') + '" data-check-id="' + dep.id + '"></div><span class="var-name">' + dep.title + '</span><a class="var-open" href="#/entry/' + dep.id + '">открыть →</a></div>'; });
    html += '</div></div>';
  }

  if (children.length > 0) {
    html += '<div class="variations-section"><div class="variations-title">Дочерние записи (' + children.length + ')</div><div class="variations-list">';
    children.forEach(child => { const chChecked = isInCart(child.id); html += '<div class="variation-item"><div class="checkbox' + (chChecked ? ' checked' : '') + '" data-check-id="' + child.id + '"></div><span class="var-name">' + child.title + '</span><a class="var-open" href="#/entry/' + child.id + '">открыть →</a></div>'; });
    html += '</div></div>';
  }
  
  html += '</div>'; app.innerHTML = html;
  
  const collapseBtn = document.getElementById('btn-collapse');
  if (isLong && isTextExpanded) collapseBtn.classList.add('visible'); else collapseBtn.classList.remove('visible');

  document.getElementById('btn-copy').addEventListener('click', async (ev) => { const text = '## ' + e.title + '\n\n' + e.content; const ok = await copyText(text); if (ok) { ev.target.textContent = '✓ Скопировано'; setTimeout(() => ev.target.textContent = '📋 Копировать', 1800); } });
  document.getElementById('btn-cart').addEventListener('click', (ev) => { toggleCart(e.id); const btn = ev.currentTarget; if (isInCart(e.id)) { btn.textContent = '✓ В корзине'; btn.classList.add('btn-copied'); } else { btn.textContent = '＋ В корзину'; btn.classList.remove('btn-copied'); } });
  
  const expandBtn = document.getElementById('btn-expand');
  if (expandBtn) { expandBtn.addEventListener('click', () => { isTextExpanded = true; renderDetail(app, id); }); }
  collapseBtn.onclick = () => { isTextExpanded = false; renderDetail(app, id); window.scrollTo({ top: 0, behavior: 'smooth' }); };
  app.querySelectorAll('.checkbox[data-check-id]').forEach(cb => cb.addEventListener('click', (ev) => { ev.stopPropagation(); toggleCart(cb.dataset.checkId); cb.classList.toggle('checked'); }));
}

function renderCart(app) {
  const coreEntry = DB.find(e => e.category === 'core');
  const entries = Array.from(cart).map(id => getEntryById(id)).filter(Boolean);
  const selectedEntries = entries.filter(e => cartSelected.has(e.id));
  
  let html = '<div class="cart-page">';
  html += '<div class="cart-header">';
  html += '<h1 class="cart-title">Корзина</h1>';
  if (entries.length > 0) {
    html += '<div style="display:flex; gap:10px; flex-wrap:wrap;">';
    html += '<button class="btn" id="btn-remove-unselected">Убрать невыделенные</button>';
    html += '<button class="btn" id="btn-clear">Очистить корзину</button>';
    html += '</div>';
  }
  html += '</div>';
  
  if (coreEntry) {
    const isCoreSelected = cartSelected.has(coreEntry.id);
    html += `
      <div class="core-cart-block">
        <div style="display:flex; align-items:center; gap:12px; background: var(--surface); border: 1px solid var(--border); border-radius: 8px; padding: 12px 16px; position: relative; flex-wrap: wrap;">
          <div class="checkbox ${isCoreSelected ? 'checked' : ''}" id="core-cart-checkbox" style="flex-shrink:0;"></div>
          <div style="flex: 1; min-width: 200px;">
            <div class="entry-title">${coreEntry.title}</div>
            <div class="entry-summary" style="font-size:12px; color:var(--text-muted);">Базовый файл игры (обязательно должен быть в игровом чате в одном экземпляре)</div>
          </div>
          <a class="ci-open" href="#/entry/${coreEntry.id}">Открыть</a>
        </div>
      </div>
    `;
  }

  const otherEntries = entries.filter(e => !coreEntry || e.id !== coreEntry.id);

  if (otherEntries.length === 0 && (!coreEntry || !cart.has(coreEntry.id))) {
    html += '<div class="cart-empty">Корзина пуста. Отметьте записи в категориях или добавьте Ядро игры.</div></div>'; 
    app.innerHTML = html; 
    const coreCb = document.getElementById('core-cart-checkbox');
    if (coreCb) { coreCb.addEventListener('click', () => { if (cart.has(coreEntry.id)) { cart.delete(coreEntry.id); cartSelected.delete(coreEntry.id); } else { cart.add(coreEntry.id); cartSelected.add(coreEntry.id); } saveCart(); render(); }); }
    return; 
  }

  if (otherEntries.length > 0) {
    html += '<div class="entries-list">'; 
    otherEntries.forEach(e => { 
      const isSelected = cartSelected.has(e.id);
      html += `
        <div class="cart-item">
          <div class="checkbox ${isSelected ? 'checked' : ''}" data-cart-check-id="${e.id}"></div>
          <div class="cart-item-content" style="flex: 1; min-width: 150px;">
            <div class="entry-title">${e.title}</div>
            <div class="entry-summary" style="font-size:12px; color:var(--text-muted);">${e.summary || ''}</div>
          </div>
          <div class="cart-item-actions">
            <a class="ci-open" href="#/entry/${e.id}">Открыть</a>
            <button class="btn" data-remove-id="${e.id}" style="padding: 4px 8px; font-size:12px;">Убрать</button>
          </div>
        </div>
      `; 
    }); 
    html += '</div>';
  }
  
  const exportCount = selectedEntries.length;
  html += '<div style="margin-top:24px;display:flex;gap:12px; flex-wrap:wrap; justify-content: flex-start;">';
  html += '<button class="btn btn-primary" id="btn-download" ' + (exportCount === 0 ? 'disabled' : '') + '>📦 Скачать <span class="desktop-only">выбранное </span>(' + exportCount + ')</button>';
  html += '<button class="btn" id="btn-copy-all" ' + (exportCount === 0 ? 'disabled' : '') + '>📋 Скопировать<span class="desktop-only"> выбранное</span></button>';
  html += '</div></div>'; 
  
  app.innerHTML = html;

  const coreCb = document.getElementById('core-cart-checkbox');
  if (coreCb) { coreCb.addEventListener('click', () => { if (cart.has(coreEntry.id)) { cart.delete(coreEntry.id); cartSelected.delete(coreEntry.id); } else { cart.add(coreEntry.id); cartSelected.add(coreEntry.id); } saveCart(); render(); }); }

  app.querySelectorAll('[data-cart-check-id]').forEach(cb => { cb.addEventListener('click', (ev) => { ev.stopPropagation(); const id = cb.dataset.cartCheckId; if (cartSelected.has(id)) cartSelected.delete(id); else cartSelected.add(id); saveCart(); render(); }); });
  app.querySelectorAll('[data-remove-id]').forEach(btn => { btn.addEventListener('click', (ev) => { ev.stopPropagation(); const id = btn.dataset.removeId; cart.delete(id); cartSelected.delete(id); saveCart(); render(); }); });

  const clearBtn = document.getElementById('btn-clear');
  if (clearBtn) { clearBtn.addEventListener('click', () => { if (confirm('Очистить корзину?')) { cart.clear(); cartSelected.clear(); saveCart(); render(); } }); }

  const removeUnselectedBtn = document.getElementById('btn-remove-unselected');
  if (removeUnselectedBtn) { removeUnselectedBtn.addEventListener('click', () => { const toRemove = []; cart.forEach(id => { if (!cartSelected.has(id)) toRemove.push(id); }); toRemove.forEach(id => cart.delete(id)); saveCart(); render(); }); }

  document.getElementById('btn-download').addEventListener('click', () => {
    let out = ''; selectedEntries.forEach(e => { out += '## ' + e.title + '\n\n' + e.content + '\n\n---\n\n'; });
    const blob = new Blob([out], { type: 'text/markdown;charset=utf-8' });
    const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = 'everup-export.md'; a.click();
  });

  document.getElementById('btn-copy-all').addEventListener('click', async (ev) => {
    let out = ''; selectedEntries.forEach(e => { out += '## ' + e.title + '\n\n' + e.content + '\n\n---\n\n'; });
    const ok = await copyText(out);
    if (ok) { 
      const originalText = ev.target.innerHTML;
      ev.target.innerHTML = '✓ Скопировано'; 
      setTimeout(() => { ev.target.innerHTML = originalText; }, 1800); 
    }
  });
}

function renderSearch(app, q) {
  const qLower = q.toLowerCase().trim(); 
  const results = qLower ? DB.filter(e => !e.parentId && ((e.title && e.title.toLowerCase().includes(qLower)) || (e.content && e.content.toLowerCase().includes(qLower)))) : [];
  
  let html = '<div class="breadcrumbs"><a href="#/">База знаний</a> <span class="sep">/</span> <span>Поиск</span></div>';
  html += '<h1 style="font-size:24px;">Поиск: «' + escapeHtml(q) + '»</h1><p style="color:var(--text-muted);margin-bottom:24px;">Найдено: ' + results.length + '</p>';
  if (results.length > 0) { html += '<div class="entries-list">'; results.forEach(e => { html += '<div class="entry-card" data-id="' + e.id + '"><div class="entry-content"><div class="entry-title">' + e.title + '</div><div class="entry-summary">' + e.summary + '</div></div></div>'; }); html += '</div>'; } else { html += '<div class="empty-state">Ничего не найдено.</div>'; }
  app.innerHTML = html; app.querySelectorAll('.entry-card').forEach(card => card.addEventListener('click', () => location.hash = '/entry/' + card.dataset.id));
}

document.getElementById('cart-btn').addEventListener('click', () => location.hash = '/cart');
document.getElementById('search-input').addEventListener('keydown', (e) => { if (e.key === 'Enter') { const q = e.target.value.trim(); if (q) location.hash = '/search?q=' + encodeURIComponent(q); } });
window.addEventListener('hashchange', render);
if (!location.hash) location.hash = '/'; else render();
</script>
